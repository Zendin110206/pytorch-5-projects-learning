[project]
name = "pytorch-5-projects-learning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchsummary>=1.5.1",
    "torchvision>=0.29.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "kaggle>=2.2.4",
]
