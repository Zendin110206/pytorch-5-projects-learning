[project]
name = "pytorch-5-projects-learning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]
        
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
